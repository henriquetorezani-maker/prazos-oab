name: Testes e implantação

# A rotina de consulta roda no Google Cloud (São Paulo), porque o Comunica bloqueia
# acessos de fora do Brasil. Aqui: testes a cada envio e, se passarem, implantação
# automática no Google Cloud (via federação de identidade, sem senhas guardadas).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  implantar:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: implantar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Houve mudança no código implantável?
        id: mudou
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --name-only HEAD~1 HEAD | grep -qE '^(prazos/|app/|Dockerfile|requirements-cloud.txt)'; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          else
            echo "Nada a implantar (só testes/docs mudaram)."
          fi
      - if: steps.mudou.outputs.sim == '1'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/676852523800/locations/global/workloadIdentityPools/github/providers/prazos-oab
          service_account: prazos-oab-deploy@project-a4f3c7af-dbb6-41b1-aa4.iam.gserviceaccount.com
      - if: steps.mudou.outputs.sim == '1'
        uses: google-github-actions/setup-gcloud@v2
      - if: steps.mudou.outputs.sim == '1'
        name: Construir e atualizar a rotina e o aplicativo
        env:
          REGIAO: southamerica-east1
        run: |
          gcloud config set project "project-a4f3c7af-dbb6-41b1-aa4"
          gcloud run jobs deploy prazos-oab --source . --region "$REGIAO" --quiet
          IMAGEM=$(gcloud run jobs describe prazos-oab --region "$REGIAO" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')
          gcloud run services update prazos-oab-app --image "$IMAGEM" --region "$REGIAO" --quiet
          echo "Implantado: $IMAGEM"
